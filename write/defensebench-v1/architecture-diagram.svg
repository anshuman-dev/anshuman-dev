<svg width="820" height="520" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg">
<style>
  .svc{fill:#fff;stroke:#2c3440;stroke-width:1.4;rx:10}
  .svc-title{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#1c2128}
  .svc-sub{font:400 11.5px 'Segoe UI',Arial,sans-serif;fill:#5b6472}
  .svc-owns{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#3d4451}
  .bug{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#b3432b}
  .lbl{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#5b6472}
  .arr{stroke:#8a92a0;stroke-width:1.4;fill:none;marker-end:url(#ah)}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#8a92a0" stroke-width="1.6"/>
  </marker>
</defs>

<rect x="20" y="20" width="780" height="30" fill="#f7f8fa" stroke="none"/>
<text x="30" y="40" font="700 14px 'Segoe UI',Arial,sans-serif" fill="#1c2128" font-weight="700" font-size="14">Three services, one live codebase, agent works inside "invoicing-api"</text>

<rect class="svc" x="60" y="90" width="230" height="150"/>
<text class="svc-title" x="80" y="118">invoicing-api</text>
<text class="svc-sub" x="80" y="136">agent-facing, port 5000</text>
<text class="svc-owns" x="80" y="158">owns: users, invoices,</text>
<text class="svc-owns" x="80" y="173">loyalty_accounts, cash_refunds</text>
<text class="bug" x="80" y="198">bug 1: BOLA (get/update invoice)</text>
<text class="bug" x="80" y="213">bug 4: delete with no owner check</text>

<rect class="svc" x="530" y="90" width="230" height="150"/>
<text class="svc-title" x="550" y="118">webhook-worker</text>
<text class="svc-sub" x="550" y="136">internal only, port 5070</text>
<text class="svc-owns" x="550" y="158">owns: its own event log</text>
<text class="bug" x="550" y="198">bug 2: check-then-write race</text>
<text class="bug" x="550" y="213">on loyalty crediting</text>

<rect class="svc" x="295" y="330" width="230" height="150"/>
<text class="svc-title" x="315" y="358">admin-reporting</text>
<text class="svc-sub" x="315" y="376">internal only, port 5090</text>
<text class="svc-owns" x="315" y="398">owns: credit_refunds ledger</text>
<text class="bug" x="315" y="423">bug 3: credit refund channel</text>
<text class="bug" x="315" y="438">checks only its own total</text>

<path class="arr" d="M290 150 L525 150"/>
<text class="lbl" x="300" y="140">invoice paid, dispatches event</text>

<path class="arr" d="M530 200 C440 260 380 260 300 340"/>
<text class="lbl" x="400" y="290">credits loyalty back on invoicing-api</text>

<path class="arr" d="M295 380 C220 320 220 220 200 245"/>
<text class="lbl" x="140" y="300">checks cash refund total</text>

<path class="arr" d="M290 220 C310 280 310 300 300 335"/>
<text class="lbl" x="190" y="270">checks credit refund total</text>

<rect x="60" y="480" width="14" height="14" fill="#fff" stroke="#2c3440"/>
<text class="lbl" x="82" y="491">service</text>
<text class="bug" x="150" y="491">bug location</text>
</svg>
